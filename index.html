<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Bot KPTM — Pembantu Digital KPTM Bangi</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap');

  :root {
    --navy: #1B2A5E;
    --navy-dark: #121d42;
    --navy-light: #243470;
    --gold: #C8972B;
    --gold-light: #e0aa3a;
    --white: #FFFFFF;
    --gray-50: #F8F9FC;
    --gray-100: #EEF0F6;
    --gray-300: #C5CAD8;
    --gray-500: #7A82A0;
    --gray-700: #3D4466;
    --green-wa: #25D366;
    --green-wa-dark: #1da851;
    --shadow-sm: 0 1px 3px rgba(27,42,94,0.08);
    --shadow-md: 0 4px 16px rgba(27,42,94,0.12);
    --shadow-lg: 0 8px 32px rgba(27,42,94,0.16);
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  html { height: 100%; height: -webkit-fill-available; }

  body {
    font-family: 'Plus Jakarta Sans', sans-serif;
    background: linear-gradient(135deg, #0f1a3d 0%, #1B2A5E 50%, #243470 100%);
    min-height: 100vh;
    min-height: -webkit-fill-available;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background:
      radial-gradient(circle at 20% 20%, rgba(200,151,43,0.08) 0%, transparent 50%),
      radial-gradient(circle at 80% 80%, rgba(200,151,43,0.06) 0%, transparent 50%);
    pointer-events: none;
  }

  /* ── WRAPPER ── */
  .chat-wrapper {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 480px;
    height: 100vh;
    height: -webkit-fill-available;
    display: flex;
    flex-direction: column;
    background: var(--gray-50);
    overflow: hidden;
  }

  @media (min-width: 520px) {
    body { padding: 16px; }
    .chat-wrapper {
      height: min(820px, calc(100vh - 32px));
      border-radius: 24px;
      box-shadow: var(--shadow-lg), 0 0 0 1px rgba(200,151,43,0.15);
    }
  }

  /* ── HEADER ── */
  .chat-header {
    background: linear-gradient(135deg, var(--navy-dark) 0%, var(--navy) 60%, var(--navy-light) 100%);
    padding: 14px 16px 13px;
    padding-top: max(14px, env(safe-area-inset-top));
    display: flex;
    align-items: center;
    gap: 12px;
    position: relative;
    flex-shrink: 0;
    z-index: 2;
  }

  .chat-header::after {
    content: '';
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 2px;
    background: linear-gradient(90deg, transparent, var(--gold), transparent);
  }

  .avatar {
    width: 44px; height: 44px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--gold), var(--gold-light));
    display: flex; align-items: center; justify-content: center;
    font-size: 13px; font-weight: 700;
    color: var(--navy);
    flex-shrink: 0;
    box-shadow: 0 0 0 3px rgba(200,151,43,0.3);
    position: relative; z-index: 1;
  }

  .avatar-pulse {
    position: absolute; inset: -4px;
    border-radius: 50%;
    border: 2px solid rgba(200,151,43,0.4);
    animation: pulse 2s ease-in-out infinite;
  }

  @keyframes pulse {
    0%,100% { transform: scale(1); opacity: 0.4; }
    50%      { transform: scale(1.12); opacity: 0.85; }
  }

  .header-info { flex: 1; min-width: 0; position: relative; z-index: 1; }

  .header-name {
    font-size: 15px; font-weight: 700;
    color: var(--white); letter-spacing: 0.01em;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }

  .header-sub {
    font-size: 11px; color: rgba(255,255,255,0.6);
    margin-top: 2px; display: flex; align-items: center; gap: 5px;
  }

  .status-dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: #4ade80; flex-shrink: 0;
    animation: blink 2s ease-in-out infinite;
  }

  @keyframes blink {
    0%,100% { opacity: 1; } 50% { opacity: 0.35; }
  }

  .header-badge {
    background: rgba(200,151,43,0.2);
    border: 1px solid rgba(200,151,43,0.4);
    border-radius: 20px; padding: 3px 10px;
    font-size: 10px; color: var(--gold-light);
    font-weight: 600; letter-spacing: 0.06em;
    text-transform: uppercase; flex-shrink: 0;
    position: relative; z-index: 1;
  }

  /* ── STICKY FAQ BAR ── */
  .faq-bar {
    background: var(--white);
    border-bottom: 1.5px solid var(--gray-100);
    padding: 9px 12px;
    display: none;
    align-items: center;
    gap: 7px;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
    flex-shrink: 0;
    /* subtle shadow below to signal stickiness */
    box-shadow: 0 2px 8px rgba(27,42,94,0.06);
  }

  .faq-bar::-webkit-scrollbar { display: none; }

  .faq-bar.visible { display: flex; }

  .faq-label {
    font-size: 9px; font-weight: 700;
    color: var(--gray-300);
    text-transform: uppercase; letter-spacing: 0.08em;
    flex-shrink: 0; white-space: nowrap;
    border-right: 1.5px solid var(--gray-100);
    padding-right: 8px;
  }

  .faq-chip {
    background: var(--gray-50);
    border: 1.5px solid var(--gray-100);
    border-radius: 20px;
    padding: 5px 11px;
    font-size: 12px; font-weight: 600;
    color: var(--navy);
    cursor: pointer;
    transition: all 0.15s ease;
    font-family: inherit;
    white-space: nowrap; flex-shrink: 0;
    -webkit-appearance: none;
  }

  .faq-chip:hover  { background: var(--navy); border-color: var(--navy); color: var(--white); }
  .faq-chip:active { transform: scale(0.95); }

  /* ── MESSAGES SCROLL AREA ── */
  .chat-messages {
    flex: 1;
    overflow-y: auto;
    overflow-x: hidden;
    padding: 14px 12px 8px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    -webkit-overflow-scrolling: touch;
    scroll-behavior: smooth;
    overscroll-behavior: contain;
  }

  .chat-messages::-webkit-scrollbar { width: 3px; }
  .chat-messages::-webkit-scrollbar-thumb { background: var(--gray-100); border-radius: 2px; }

  /* Date divider */
  .date-divider {
    display: flex; align-items: center; gap: 8px;
    font-size: 10px; color: var(--gray-300); font-weight: 500;
    flex-shrink: 0; margin-bottom: 2px;
  }
  .date-divider::before,.date-divider::after {
    content: ''; flex: 1; height: 1px; background: var(--gray-100);
  }

  /* ── BUBBLES ── */
  .msg-row {
    display: flex; align-items: flex-end; gap: 7px;
    animation: msgIn 0.22s ease-out;
    flex-shrink: 0;
  }

  @keyframes msgIn {
    from { opacity: 0; transform: translateY(7px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .msg-row.user { flex-direction: row-reverse; }

  .msg-avatar {
    width: 26px; height: 26px; border-radius: 50%;
    background: linear-gradient(135deg, var(--gold), var(--gold-light));
    display: flex; align-items: center; justify-content: center;
    font-size: 9px; font-weight: 700; color: var(--navy);
    flex-shrink: 0;
  }

  .msg-content { max-width: 80%; display: flex; flex-direction: column; }
  .msg-row.user .msg-content { align-items: flex-end; }

  .msg-bubble {
    padding: 10px 13px; border-radius: 16px;
    font-size: 13.5px; line-height: 1.55;
    word-break: break-word;
  }

  .msg-row.bot  .msg-bubble {
    background: var(--white); color: var(--gray-700);
    border-bottom-left-radius: 4px;
    box-shadow: var(--shadow-sm); border: 1px solid var(--gray-100);
  }

  .msg-row.user .msg-bubble {
    background: linear-gradient(135deg, var(--navy), var(--navy-light));
    color: var(--white); border-bottom-right-radius: 4px;
    box-shadow: var(--shadow-md);
  }

  .msg-time {
    font-size: 10px; color: var(--gray-300);
    margin-top: 3px; padding: 0 2px;
  }

  /* Initial greeting chips */
  .quick-replies-initial {
    display: flex; flex-wrap: wrap; gap: 7px;
    padding-left: 33px;
    animation: msgIn 0.3s ease-out 0.15s both;
    flex-shrink: 0;
  }

  .chip {
    background: var(--white);
    border: 1.5px solid var(--gold);
    border-radius: 20px; padding: 6px 13px;
    font-size: 12px; font-weight: 600;
    color: var(--navy); cursor: pointer;
    transition: all 0.15s; font-family: inherit;
  }

  .chip:hover  { background: var(--gold); color: var(--white); }
  .chip:active { transform: scale(0.95); }

  /* Typing indicator */
  .typing-row {
    display: flex; align-items: flex-end; gap: 7px; flex-shrink: 0;
  }

  .typing-bubble {
    background: var(--white); border: 1px solid var(--gray-100);
    border-radius: 16px; border-bottom-left-radius: 4px;
    padding: 12px 14px; box-shadow: var(--shadow-sm);
    display: flex; gap: 4px; align-items: center;
  }

  .typing-dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--gray-300);
    animation: typingBounce 1.2s ease-in-out infinite;
  }
  .typing-dot:nth-child(2) { animation-delay: 0.15s; }
  .typing-dot:nth-child(3) { animation-delay: 0.3s; }

  @keyframes typingBounce {
    0%,60%,100% { transform: translateY(0); background: var(--gray-300); }
    30%          { transform: translateY(-5px); background: var(--gold); }
  }

  /* ── WHATSAPP BUTTON ── */
  .wa-wrap {
    padding-left: 33px;
    flex-shrink: 0;
    animation: msgIn 0.25s ease-out;
    max-width: calc(80% + 33px);
  }

  .wa-button {
    display: flex; align-items: center; justify-content: center; gap: 10px;
    width: 100%;
    background: linear-gradient(135deg, var(--green-wa), var(--green-wa-dark));
    color: var(--white); text-decoration: none;
    border-radius: 12px; padding: 13px 16px;
    font-size: 14px; font-weight: 700; font-family: inherit;
    transition: opacity 0.15s, transform 0.15s;
    box-shadow: 0 4px 16px rgba(37,211,102,0.35);
  }

  .wa-button:active { opacity: 0.88; transform: scale(0.98); }

  .wa-icon { width: 20px; height: 20px; fill: white; flex-shrink: 0; }

  /* ── INPUT AREA ── */
  .chat-input-area {
    background: var(--white);
    border-top: 1px solid var(--gray-100);
    padding: 10px 12px;
    padding-bottom: max(10px, env(safe-area-inset-bottom));
    display: flex; align-items: flex-end; gap: 8px;
    flex-shrink: 0;
  }

  .input-wrap {
    flex: 1;
    background: var(--gray-50);
    border: 1.5px solid var(--gray-100);
    border-radius: 20px;
    display: flex; align-items: center;
    padding: 0 14px;
    transition: border-color 0.2s, box-shadow 0.2s;
    min-height: 42px;
  }

  .input-wrap:focus-within {
    border-color: var(--gold); background: var(--white);
    box-shadow: 0 0 0 3px rgba(200,151,43,0.08);
  }

  #userInput {
    flex: 1; border: none; background: transparent;
    padding: 10px 0; font-size: 14px; font-family: inherit;
    color: var(--gray-700); outline: none; resize: none;
    max-height: 90px; line-height: 1.45;
    -webkit-appearance: none;
  }

  #userInput::placeholder { color: var(--gray-300); }

  .send-btn {
    width: 40px; height: 40px; border-radius: 50%;
    background: linear-gradient(135deg, var(--gold), var(--gold-light));
    border: none; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
    box-shadow: 0 2px 8px rgba(200,151,43,0.4);
    transition: transform 0.12s;
  }

  .send-btn:active { transform: scale(0.9); }
  .send-btn svg { width: 17px; height: 17px; fill: var(--navy); margin-left: 2px; }

  /* ── POWERED BY ── */
  .powered-by {
    text-align: center; font-size: 10px;
    color: var(--gray-300); padding: 4px 0 6px;
    background: var(--white); letter-spacing: 0.03em;
    flex-shrink: 0;
  }
  .powered-by span { color: var(--gold); font-weight: 600; }
</style>
</head>
<body>
<div class="chat-wrapper">

  <!-- HEADER -->
  <div class="chat-header">
    <div class="avatar">BK<div class="avatar-pulse"></div></div>
    <div class="header-info">
      <div class="header-name">Bot KPTM</div>
      <div class="header-sub"><span class="status-dot"></span>Pembantu Digital KPTM Bangi</div>
    </div>
    <div class="header-badge">AI</div>
  </div>

  <!-- STICKY FAQ BAR — hidden until first reply -->
  <div class="faq-bar" id="faqBar">
    <span class="faq-label">FAQ</span>
    <button class="faq-chip" onclick="askFaq('Program yang ditawarkan')">📚 Program</button>
    <button class="faq-chip" onclick="askFaq('Syarat kemasukan')">📋 Syarat</button>
    <button class="faq-chip" onclick="askFaq('Yuran pengajian')">💰 Yuran</button>
    <button class="faq-chip" onclick="askFaq('Cara mohon')">📝 Cara Mohon</button>
    <button class="faq-chip" onclick="askFaq('Tarikh intake')">📅 Intake</button>
    <button class="faq-chip" onclick="askFaq('Kemudahan asrama')">🏠 Asrama</button>
    <button class="faq-chip" onclick="askFaq('Bantuan kewangan')">💳 Biasiswa</button>
    <button class="faq-chip" onclick="askFaq('Lokasi KPTM Bangi')">📍 Lokasi</button>
  </div>

  <!-- MESSAGES -->
  <div class="chat-messages" id="chatMessages">
    <div class="date-divider">Hari ini</div>
  </div>

  <!-- INPUT -->
  <div class="chat-input-area">
    <div class="input-wrap">
      <textarea id="userInput" placeholder="Taip soalan anda..." rows="1"></textarea>
    </div>
    <button class="send-btn" onclick="sendMessage()" aria-label="Hantar">
      <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
    </button>
  </div>

  <div class="powered-by">Dikuasakan oleh <span>Stegg.dev</span> · AI oleh Gemma</div>

</div>
<script>
  // ── CONFIG ──
  const N8N_WEBHOOK  = 'https://n8n.stegg.dev/webhook/kptm-chat';
  const AGENT_WA_NUM = '601XXXXXXXXX'; // ← replace with real number
  const TIMEOUT_MS   = 30000;

  // ── STATE ──
  let sessionId          = 'ks_' + Math.random().toString(36).substr(2,9);
  let unansweredCount    = 0;
  let escalating         = false;
  let isTyping           = false;
  let faqBarShown        = false;

  const SYSTEM_PROMPT = `Anda adalah "Bot KPTM", pembantu digital rasmi KPTM Bangi Kolej (Kolej Poly-Tech MARA Bangi).
PERANAN: Bantu pelajar prospektif dengan soalan kemasukan dan program KPTM Bangi. Jawab dalam Bahasa Malaysia formal. Jangan jawab soalan tidak berkaitan atau sebut pesaing.
MAKLUMAT:
- Web: https://bangi.kptm.edu.my | Tel: +603-8744 3700 | Waktu: Isnin-Jumaat 8am-5pm
- Program Diploma: Pengurusan Perniagaan, Perakaunan, Teknologi Maklumat
- Program Sijil: Pengurusan Perniagaan, Perakaunan
- Syarat Diploma: SPM 3 kredit (BM+Math), warganegara Malaysia
- Syarat Sijil: Lulus SPM/PMR/PT3
- Yuran Diploma: RM3,000-5,000/sem | Sijil: RM1,500-2,500/sem
- Intake: Mac & September. Daftar 2-3 bulan awal.
- Dokumen: Sijil SPM, IC pemohon, IC ibu/bapa, sijil lahir, gambar pasport x2, borang permohonan
- Cara mohon: bangi.kptm.edu.my → Pengambilan Pelajar → borang online
- Asrama: Ada (lelaki/perempuan berasingan), WiFi, dewan makan
- Kewangan: MARA EDULOAN, PTPTN, Zakat Selangor
- Lokasi: KPTM Bangi, Selangor. Maps: https://share.google/qpcxd15QcH2ymoyuy
Jika tidak pasti, rujuk +603-8744 3700. Respons ringkas dan mesra.`;

  // ── HELPERS ──
  const getTime = () => new Date().toLocaleTimeString('ms-MY',{hour:'2-digit',minute:'2-digit'});

  function esc(t) {
    return String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  function scrollBottom() {
    const el = document.getElementById('chatMessages');
    requestAnimationFrame(() => el.scrollTop = el.scrollHeight);
  }

  function autoResize(el) {
    el.style.height = 'auto';
    el.style.height = Math.min(el.scrollHeight, 90) + 'px';
  }

  function showFaqBar() {
    if (faqBarShown) return;
    faqBarShown = true;
    document.getElementById('faqBar').classList.add('visible');
  }

  // ── RENDER ──
  function botMsg(html) {
    const msgs = document.getElementById('chatMessages');
    const row = document.createElement('div');
    row.className = 'msg-row bot';
    row.innerHTML = `
      <div class="msg-avatar">BK</div>
      <div class="msg-content">
        <div class="msg-bubble">${html}</div>
        <div class="msg-time">${getTime()}</div>
      </div>`;
    msgs.appendChild(row);
    scrollBottom();
  }

  function userMsg(text) {
    const msgs = document.getElementById('chatMessages');
    const row = document.createElement('div');
    row.className = 'msg-row user';
    row.innerHTML = `
      <div class="msg-content">
        <div class="msg-bubble">${esc(text)}</div>
        <div class="msg-time">${getTime()}</div>
      </div>`;
    msgs.appendChild(row);
    showFaqBar();
    scrollBottom();
  }

  function showTyping() {
    if (isTyping) return;
    isTyping = true;
    const msgs = document.getElementById('chatMessages');
    const row = document.createElement('div');
    row.className = 'typing-row';
    row.id = 'typingRow';
    row.innerHTML = `
      <div class="msg-avatar">BK</div>
      <div class="typing-bubble">
        <div class="typing-dot"></div>
        <div class="typing-dot"></div>
        <div class="typing-dot"></div>
      </div>`;
    msgs.appendChild(row);
    scrollBottom();
  }

  function hideTyping() {
    document.getElementById('typingRow')?.remove();
    isTyping = false;
  }

  // ── WHATSAPP ESCALATION ──
  function showWaButton(customMsg) {
    const msgs = document.getElementById('chatMessages');
    const encodedText = encodeURIComponent(
      customMsg || 'Hi, saya ingin bertanya tentang kemasukan KPTM Bangi.'
    );
    const wrap = document.createElement('div');
    wrap.className = 'wa-wrap';
    wrap.innerHTML = `
      <a href="https://wa.me/${AGENT_WA_NUM}?text=${encodedText}"
         target="_blank" rel="noopener" class="wa-button">
        <svg class="wa-icon" viewBox="0 0 24 24">
          <path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/>
        </svg>
        💬 Hubungi Agent WhatsApp
      </a>`;
    msgs.appendChild(wrap);
    scrollBottom();
  }

  function triggerEscalation() {
    escalating = true;
    botMsg('Baik! Saya akan hubungkan anda dengan ejen kami sekarang. Sila klik butang di bawah untuk berbual terus melalui WhatsApp. 😊');
    showWaButton();
    setTimeout(() => {
      escalating = false;
      botMsg('Anda juga boleh teruskan bertanya di sini jika ada soalan lain. 😊');
      unansweredCount = 0;
    }, 900);
  }

  function isEscalationRequest(msg) {
    const kw = ['agent','staff','manusia','nak cakap','cakap dengan orang','pegawai','petugas','human','orang sebenar','hubungi','talk to','speak to'];
    const lc = msg.toLowerCase();
    return kw.some(k => lc.includes(k));
  }

  // ── AI CALL ──
  async function callAI(message) {
    const ctrl = new AbortController();
    const tid  = setTimeout(() => ctrl.abort(), TIMEOUT_MS);
    try {
      const res = await fetch(N8N_WEBHOOK, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message, sessionId, systemPrompt: SYSTEM_PROMPT }),
        signal: ctrl.signal
      });
      clearTimeout(tid);
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const d = await res.json();
      return d.reply || d.response || d.text || null;
    } catch {
      clearTimeout(tid);
      return null;
    }
  }

  // ── DEMO RESPONSES ──
  function demoReply(msg) {
    const q = msg.toLowerCase();

    if (/program|kursus|diploma|sijil|bidang/.test(q))
      return '📚 <strong>Program di KPTM Bangi:</strong><br><br>🎓 <strong>Diploma:</strong><br>• Pengurusan Perniagaan<br>• Perakaunan<br>• Teknologi Maklumat<br><br>📜 <strong>Sijil:</strong><br>• Pengurusan Perniagaan<br>• Perakaunan<br><br>Maklumat lanjut: <a href="https://bangi.kptm.edu.my" target="_blank" style="color:var(--gold);font-weight:600">bangi.kptm.edu.my</a>';

    if (/syarat|kelayakan|kredit|spm/.test(q))
      return '📋 <strong>Syarat Kemasukan:</strong><br><br><strong>Diploma:</strong><br>• SPM — min. 3 kredit (wajib BM & Matematik)<br>• Warganegara Malaysia<br><br><strong>Sijil:</strong><br>• Lulus SPM / PMR / PT3<br>• Syarat bergantung program';

    if (/mohon|daftar|apply|cara|pendaftaran|permohonan/.test(q))
      return '📝 <strong>Cara Memohon:</strong><br><br>1️⃣ Layari <a href="https://bangi.kptm.edu.my" target="_blank" style="color:var(--gold);font-weight:600">bangi.kptm.edu.my</a><br>2️⃣ Klik <em>Pengambilan Pelajar</em><br>3️⃣ Isi borang online<br>4️⃣ Hantar dokumen<br>5️⃣ Tunggu tawaran / temuduga<br><br>📅 Intake: <strong>Mac</strong> & <strong>September</strong>';

    if (/intake|tarikh|bila|semester|mula/.test(q))
      return '📅 <strong>Tarikh Intake:</strong><br><br>• <strong>Intake Mac</strong> — Semester 1<br>• <strong>Intake September</strong> — Semester 2<br><br>Pendaftaran dibuka <strong>2–3 bulan</strong> sebelum intake. Pantau <a href="https://bangi.kptm.edu.my" target="_blank" style="color:var(--gold)">laman web</a> untuk tarikh tepat.';

    if (/asrama|hostel|penginapan|tinggal|duduk/.test(q))
      return '🏠 <strong>Kemudahan Asrama:</strong><br><br>✅ Berasingan — lelaki & perempuan<br>✅ WiFi & dewan makan<br>✅ Permohonan semasa daftar masuk<br><br>📞 Unit Penginapan: <strong>+603-8744 3700</strong>';

    if (/dokumen|bawa|senarai|keperluan|apa yang/.test(q))
      return '📄 <strong>Dokumen Diperlukan:</strong><br><br>✅ Sijil SPM / keputusan peperiksaan<br>✅ IC pemohon<br>✅ IC ibu/bapa atau penjaga<br>✅ Sijil kelahiran<br>✅ Gambar pasport (2 keping)<br>✅ Borang permohonan lengkap';

    if (/biasiswa|ptptn|mara|pinjaman|zakat|kewangan|bantuan|wang/.test(q))
      return '💳 <strong>Bantuan Kewangan:</strong><br><br>• <strong>MARA EDULOAN</strong> (Bumiputera)<br><a href="https://myeduloan.mara.gov.my" target="_blank" style="color:var(--gold)">myeduloan.mara.gov.my</a><br><br>• <strong>PTPTN</strong><br><a href="https://www.ptptn.gov.my" target="_blank" style="color:var(--gold)">ptptn.gov.my</a><br><br>• <strong>Zakat Selangor</strong> — bagi yang layak';

    if (/lokasi|mana|alamat|map|jalan|google|maps/.test(q))
      return '📍 <strong>Lokasi KPTM Bangi:</strong><br><br>Kolej Poly-Tech MARA Bangi, Selangor<br>📞 +603-8744 3700<br>🕗 Isnin–Jumaat · 8pagi–5petang<br><br><a href="https://share.google/qpcxd15QcH2ymoyuy" target="_blank" style="color:var(--gold);font-weight:600">🗺️ Buka Google Maps</a>';

    if (/terima kasih|tq|thanks|ok dah|selesai/.test(q))
      return 'Sama-sama! 😊 Semoga berjaya dalam permohonan ke KPTM Bangi. Ada soalan lain?';

      return 'Waalaikumussalam! Selamat datang ke KPTM Bangi 😊 Ada yang boleh saya bantu hari ini?';

    // Unknown
    unansweredCount++;
    if (unansweredCount >= 3) {
      unansweredCount = 0;
      setTimeout(() => triggerEscalation(), 600);
      return 'Maaf, saya tidak mempunyai maklumat untuk soalan tersebut. Biarkan saya hubungkan anda dengan ejen kami.';
    }

    return 'Maaf, saya tidak dapat menjawab soalan tersebut. Cuba tanya perkara lain, atau hubungi kami di <strong>+603-8744 3700</strong>. 😊';
  }

  // ── FAQ SHORTCUT ──
  function askFaq(topic) {
    if (escalating) return;
    sendUserMessage(topic);
  }

  // ── MAIN SEND ──
  async function sendUserMessage(text) {
    text = text.trim();
    if (!text || isTyping) return;

    // Remove greeting chips
    document.getElementById('initialChips')?.remove();

    userMsg(text);
    document.getElementById('userInput').value = '';
    document.getElementById('userInput').style.height = 'auto';

    // Escalation keyword → direct WA
    if (isEscalationRequest(text)) {
      showTyping();
      await new Promise(r => setTimeout(r, 700));
      hideTyping();
      triggerEscalation();
      return;
    }

    // AI → fallback demo
    showTyping();
    const aiReply = await callAI(text);
    hideTyping();
    const reply = aiReply || demoReply(text);

    if (/tidak mempunyai maklumat|tidak dapat menjawab/.test(reply)) {
      unansweredCount++;
    } else {
      unansweredCount = 0;
    }

    botMsg(reply);

    if (unansweredCount >= 3 && !escalating) {
      unansweredCount = 0;
      setTimeout(() => triggerEscalation(), 500);
    }
  }

  function sendMessage() {
    sendUserMessage(document.getElementById('userInput').value);
  }

  // ── INPUT EVENTS ──
  const inp = document.getElementById('userInput');

  inp.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
  });

  inp.addEventListener('input', function() { autoResize(this); });

  // iOS keyboard — scroll to bottom when keyboard opens
  inp.addEventListener('focus', () => setTimeout(scrollBottom, 400));

  // ── INIT ──
  window.addEventListener('load', () => {
    setTimeout(() => {
      botMsg('Assalamualaikum! Saya <strong>Bot KPTM</strong>, pembantu digital KPTM Bangi Kolej. Boleh saya bantu anda hari ini? 😊');

      // One-time greeting chips
      const msgs = document.getElementById('chatMessages');
      const wrap = document.createElement('div');
      wrap.className = 'quick-replies-initial';
      wrap.id = 'initialChips';

      const items = [
        { label: '📚 Program', topic: 'Program yang ditawarkan' },
        { label: '📋 Syarat', topic: 'Syarat kemasukan' },
        { label: '💰 Yuran',  topic: 'Yuran pengajian' },
        { label: '📝 Cara Mohon', topic: 'Cara mohon' },
      ];

      items.forEach(({ label, topic }) => {
        const btn = document.createElement('button');
        btn.className = 'chip';
        btn.textContent = label;
        btn.onclick = () => { wrap.remove(); sendUserMessage(topic); };
        wrap.appendChild(btn);
      });

      msgs.appendChild(wrap);
      scrollBottom();
    }, 500);
  });
</script>
