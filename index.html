<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ocha Healthcare | AI Medical Concierge</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Plus Jakarta Sans"', 'sans-serif'],
                        serif: ['"Lora"', 'serif'],
                    },
                    colors: {
                        taupe: { 500: '#756A5B', 600: '#5D5448' },
                        indigo: {
                            50: '#f0f8ff', 100: '#e0f0fe', 200: '#bae2fd', 300: '#7ccbfd',
                            400: '#36b2fa', 500: '#0c9aeb', 600: '#276ca1', 700: '#1e5583',
                            800: '#1a476f', 900: '#193d5d', 950: '#10273d',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        html { scroll-behavior: smooth; }
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f8fafc; color: #0f172a; }
        .bg-tech-grid { background-size: 40px 40px; background-image: radial-gradient(circle, #cbd5e1 1.5px, transparent 1.5px); }
        .glass-panel { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(12px); border-bottom: 1px solid #e2e8f0; }
        .mask-image-gradient { mask-image: linear-gradient(to bottom, black 0%, transparent 100%); -webkit-mask-image: linear-gradient(to bottom, black 0%, transparent 100%); }
        @keyframes float { 0% { transform: translateY(0px); } 50% { transform: translateY(-10px); } 100% { transform: translateY(0px); } }
        .animate-float { animation: float 6s ease-in-out infinite; }
        @keyframes fadeUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        .animate-fade-up { animation: fadeUp 0.8s ease-out forwards; }
        .destination-card:hover .dest-img { transform: scale(1.05); }
    </style>
    <script type="importmap">
    {
      "imports": {
        "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
        "react": "https://esm.sh/react@18.2.0",
        "lucide-react": "https://esm.sh/lucide-react@0.303.0"
      }
    }
    </script>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel" data-type="module">
        import React, { useState, useEffect } from 'react';
        import { createRoot } from 'react-dom/client';
        import { 
            Search, Sparkles, Activity, MapPin, Calendar, 
            Plane, Check, User, ArrowRight, ChevronDown,
            Star, ShieldCheck, Clock, HeartHandshake, HelpCircle, Plus, Minus,
            Stethoscope, Building2, Filter, Loader2, Globe
        } from 'lucide-react';

        // ==========================================
        //   DATA CONFIGURATION
        // ==========================================
        const LIVE_DATA_URL = "https://script.google.com/macros/s/AKfycbyvEJvNE4Xi_qtp3vm0GFLjTooG3ES14hXSRlaf0vxm6voCiwKTdEDxH2sYw6mtDPqakw/exec"; 

        // --- HELPER: CLEAN LANGUAGES ---
        const cleanLanguage = (lang) => {
            if (!lang) return "";
            const map = { 'inggris': 'English', 'melayu': 'Malay', 'mandarin': 'Mandarin', 'tamil': 'Tamil' };
            const lower = lang.toLowerCase().trim();
            return map[lower] || lang;
        };

        // --- COMPONENTS ---
        const Logo = ({ className = "h-12" }) => (
            <img src="Ocha Logo Transparent background email 1.png" alt="Ocha Healthcare" className={`${className} object-contain`} />
        );

        // --- DOCTOR CARD COMPONENT ---
        const DoctorCard = ({ doc, onClick }) => {
            // Fallback Image
            const imageSrc = (doc.image && doc.image.startsWith('http')) 
                ? doc.image 
                : "https://cdn-icons-png.flaticon.com/512/3774/3774299.png"; 

            return (
                <div className="bg-white p-6 rounded-xl shadow-sm border border-slate-100 hover:shadow-md transition hover:border-indigo-100 flex flex-col h-full animate-fade-up">
                    <div className="flex items-start gap-4 mb-4">
                        <div className="w-16 h-16 rounded-full bg-slate-100 overflow-hidden shrink-0 border border-slate-100">
                            <img src={imageSrc} className="w-full h-full object-cover" onError={(e) => e.target.src = "https://cdn-icons-png.flaticon.com/512/3774/3774299.png"} />
                        </div>
                        <div className="min-w-0">
                            <h3 className="font-bold text-lg text-slate-900 leading-tight mb-1">{doc.name}</h3>
                            <p className="text-indigo-600 font-medium text-sm truncate">{doc.specialty}</p>
                            <p className="text-slate-500 text-xs mt-1 flex items-center gap-1 truncate">
                                <Building2 className="w-3 h-3" /> {doc.hospital}
                            </p>
                        </div>
                    </div>
                    
                    <div className="space-y-3 mb-6 flex-1">
                        {/* Only show Experience if it's valid text */}
                        {doc.experience && doc.experience !== "Unknown" && (
                            <div className="flex items-start gap-2 text-sm text-slate-600">
                                <Activity className="w-4 h-4 text-slate-400 mt-0.5 shrink-0" />
                                <span className="line-clamp-2">Exp: {doc.experience.replace('Experience', '')}</span>
                            </div>
                        )}
                        
                        {/* Languages Chip */}
                        <div className="flex items-start gap-2 text-sm text-slate-600">
                            <Globe className="w-4 h-4 text-slate-400 mt-0.5 shrink-0" />
                            <div className="flex flex-wrap gap-1">
                                {doc.languages.slice(0, 3).map((lang, idx) => (
                                    <span key={idx} className="bg-slate-100 text-slate-600 text-xs px-2 py-0.5 rounded-full border border-slate-200">
                                        {cleanLanguage(lang)}
                                    </span>
                                ))}
                                {doc.languages.length > 3 && <span className="text-xs text-slate-400 px-1">+{doc.languages.length - 3}</span>}
                            </div>
                        </div>
                    </div>

                    <button onClick={() => onClick(doc)} className="w-full py-2.5 bg-indigo-50 text-indigo-700 font-medium rounded-lg hover:bg-indigo-600 hover:text-white transition-all text-sm shadow-sm">
                        View Profile
                    </button>
                </div>
            );
        };

        // --- DOCTOR PROFILE COMPONENT ---
        const DoctorProfile = ({ doctor, onBack }) => {
            if (!doctor) return null;
            
            // Push ID to URL so users can share links
            useEffect(() => {
                const newUrl = `${window.location.pathname}?id=${doctor.id}`;
                window.history.pushState({ path: newUrl }, '', newUrl);
            }, [doctor]);

            const imageSrc = (doctor.image && doctor.image.startsWith('http')) ? doctor.image : "https://cdn-icons-png.flaticon.com/512/3774/3774299.png";
            const lastName = doctor.name.split(' ').slice(1).join(' ') || doctor.name;

            return (
                <div className="pt-32 pb-20 px-4 max-w-5xl mx-auto animate-fade-up min-h-screen">
                    <button onClick={() => {
                        window.history.pushState({}, '', window.location.pathname); // Clean URL on back
                        onBack();
                    }} className="mb-8 flex items-center gap-2 text-slate-500 hover:text-indigo-600 transition font-medium">
                        <ArrowRight className="w-4 h-4 rotate-180" /> Back to Directory
                    </button>
                    
                    <div className="grid md:grid-cols-3 gap-8 items-start">
                        {/* Left Sidebar */}
                        <div className="md:col-span-1">
                            <div className="bg-white p-6 rounded-2xl shadow-sm border border-slate-100 text-center sticky top-32">
                                <div className="w-32 h-32 mx-auto rounded-full overflow-hidden mb-4 ring-4 ring-indigo-50 bg-slate-50">
                                    <img src={imageSrc} alt={doctor.name} className="w-full h-full object-cover" onError={(e) => e.target.src = "https://cdn-icons-png.flaticon.com/512/3774/3774299.png"} />
                                </div>
                                <h1 className="font-serif text-2xl text-slate-900 font-bold mb-1">{doctor.name}</h1>
                                <p className="text-indigo-600 font-medium mb-4">{doctor.specialty}</p>
                                <div className="space-y-3 text-left border-t border-slate-100 pt-4">
                                    <div className="flex items-start gap-3 text-sm text-slate-600"><Building2 className="w-4 h-4 text-slate-400 mt-0.5 shrink-0" /><span>{doctor.hospital}</span></div>
                                    <div className="flex items-start gap-3 text-sm text-slate-600"><MapPin className="w-4 h-4 text-slate-400 mt-0.5 shrink-0" /><span>{doctor.location}</span></div>
                                    <div className="flex items-start gap-3 text-sm text-slate-600"><Activity className="w-4 h-4 text-slate-400 mt-0.5 shrink-0" /><span>{doctor.experience}</span></div>
                                </div>
                                <button className="w-full mt-6 bg-indigo-600 text-white py-3 rounded-xl font-medium hover:bg-indigo-700 transition shadow-lg shadow-indigo-200">Book Appointment</button>
                            </div>
                        </div>

                        {/* Right Content */}
                        <div className="md:col-span-2 space-y-6">
                            <div className="bg-white p-8 rounded-2xl shadow-sm border border-slate-100">
                                <h2 className="font-serif text-xl font-bold text-slate-900 mb-4 flex items-center gap-2"><User className="w-5 h-5 text-indigo-600" /> About Dr. {lastName}</h2>
                                <p className="text-slate-600 leading-relaxed mb-6 whitespace-pre-wrap">
                                    {doctor.bio && doctor.bio !== "Unknown" ? doctor.bio : `Dr. ${lastName} is a highly experienced ${doctor.specialty} practicing at ${doctor.hospital}. We are currently updating their full biography.`}
                                </p>
                                <div className="grid grid-cols-2 gap-4">
                                    <div className="bg-indigo-50/50 p-4 rounded-xl border border-indigo-100">
                                        <div className="text-xs font-bold text-slate-400 uppercase tracking-wider mb-1">Languages</div>
                                        <div className="font-medium text-slate-800 flex flex-wrap gap-1">
                                            {doctor.languages.map(l => cleanLanguage(l)).join(', ')}
                                        </div>
                                    </div>
                                    <div className="bg-emerald-50/50 p-4 rounded-xl border border-emerald-100">
                                        <div className="text-xs font-bold text-slate-400 uppercase tracking-wider mb-1">Status</div>
                                        <div className="font-medium text-emerald-700 flex items-center gap-1">
                                            <div className="w-2 h-2 rounded-full bg-emerald-500"></div> Accepting Patients
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        const DoctorsPage = ({ db, onDoctorClick }) => {
            const [filterSpecialty, setFilterSpecialty] = useState('All');
            const [searchTerm, setSearchTerm] = useState('');
            
            // Clean specialties list
            const specialties = ['All', ...new Set(db.doctors.map(d => d.specialty).filter(s => s && s !== "Unknown"))];
            
            const filteredDoctors = db.doctors.filter(d => {
                const matchesSpecialty = filterSpecialty === 'All' || d.specialty === filterSpecialty;
                const matchesSearch = d.name.toLowerCase().includes(searchTerm.toLowerCase()) || d.hospital.toLowerCase().includes(searchTerm.toLowerCase());
                return matchesSpecialty && matchesSearch;
            });

            return (
                <div className="pt-32 pb-20 px-4 max-w-7xl mx-auto animate-fade-up min-h-screen">
                    <div className="text-center mb-12">
                        <h1 className="font-serif text-4xl text-slate-900 mb-4">Find a Specialist</h1>
                        <p className="text-slate-500">Connect with {db.doctors.length > 0 ? db.doctors.length : "..."} verified specialists.</p>
                    </div>
                    
                    <div className="bg-white p-4 rounded-xl shadow-sm border border-slate-100 flex flex-col md:flex-row gap-4 mb-8 max-w-4xl mx-auto">
                        <div className="flex-1 relative">
                            <Search className="absolute left-3 top-1/2 -translate-y-1/2 w-5 h-5 text-slate-400" />
                            <input type="text" placeholder="Search doctor or hospital..." className="w-full pl-10 pr-4 py-2 bg-slate-50 border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500/20" value={searchTerm} onChange={(e) => setSearchTerm(e.target.value)} />
                        </div>
                        <div className="w-full md:w-64">
                            <select className="w-full py-2 px-3 bg-slate-50 border border-slate-200 rounded-lg text-slate-600 focus:outline-none focus:ring-2 focus:ring-indigo-500/20" value={filterSpecialty} onChange={(e) => setFilterSpecialty(e.target.value)}>
                                {specialties.map(s => <option key={s} value={s}>{s === 'All' ? 'All Specialties' : s}</option>)}
                            </select>
                        </div>
                    </div>

                    <div className="grid md:grid-cols-2 lg:grid-cols-3 gap-6">
                        {filteredDoctors.map((doc, i) => (
                            <DoctorCard key={doc.id || i} doc={doc} onClick={onDoctorClick} />
                        ))}
                        {filteredDoctors.length === 0 && (
                            <div className="col-span-full text-center py-12 text-slate-400 flex flex-col items-center">
                                <Loader2 className="w-8 h-8 animate-spin mb-2" />
                                <span>Loading doctors database...</span>
                            </div>
                        )}
                    </div>
                </div>
            );
        };
        
        // --- OTHER PAGES (Hospitals, Treatments, etc.) ---
        const HospitalsPage = ({ db }) => (
            <div className="pt-32 pb-20 px-4 max-w-7xl mx-auto animate-fade-up min-h-screen">
                <h1 className="font-serif text-4xl text-slate-900 mb-8">Partner Hospitals</h1>
                <div className="grid md:grid-cols-2 gap-6">
                    {db.hospitals.map(hospital => (
                        <div key={hospital.id} className="bg-white rounded-xl shadow-sm border border-slate-100 overflow-hidden hover:shadow-md transition group">
                            <div className="h-48 overflow-hidden relative">
                                <img src={hospital.image} className="w-full h-full object-cover group-hover:scale-105 transition duration-500" />
                                <div className="absolute top-3 right-3 bg-white/90 backdrop-blur px-2 py-1 rounded text-xs font-bold flex items-center gap-1"><Star className="w-3 h-3 text-amber-500 fill-amber-500" /> {hospital.rating}</div>
                            </div>
                            <div className="p-6">
                                <h3 className="font-bold text-lg text-slate-900 mb-1">{hospital.name}</h3>
                                <p className="text-sm text-slate-500 mb-4 flex items-center gap-1"><MapPin className="w-3 h-3" /> {hospital.city}, {hospital.country}</p>
                                <div className="flex flex-wrap gap-2 mb-6">{hospital.badges.map((badge, i) => (<span key={i} className="text-xs bg-slate-100 text-slate-600 px-2 py-1 rounded-md border border-slate-200">{badge}</span>))}</div>
                                <button className="w-full py-2 border border-indigo-600 text-indigo-600 font-medium rounded-lg hover:bg-indigo-50 transition">View Details</button>
                            </div>
                        </div>
                    ))}
                </div>
            </div>
        );

        const TreatmentsPage = ({ db }) => (
            <div className="pt-32 pb-20 px-4 max-w-5xl mx-auto animate-fade-up min-h-screen">
                <div className="text-center mb-12"><h1 className="font-serif text-4xl text-slate-900 mb-4">Treatment Pricing</h1><p className="text-slate-500">Transparent cost estimates.</p></div>
                <div className="space-y-8">{db.treatments.map((cat, i) => (<div key={i} className="bg-white rounded-2xl shadow-sm border border-slate-100 overflow-hidden"><div className="bg-indigo-50/50 p-6 border-b border-indigo-100 flex items-center gap-3"><Stethoscope className="w-6 h-6 text-indigo-600" /><h2 className="text-xl font-bold text-slate-800">{cat.category}</h2></div><div className="divide-y divide-slate-100">{cat.items.map((item, j) => (<div key={j} className="p-6 hover:bg-slate-50 transition flex flex-col md:flex-row justify-between items-center gap-4"><div className="flex-1"><h4 className="font-bold text-slate-900">{item.name}</h4><span className="text-xs text-slate-400 flex items-center gap-1 mt-1"><Clock className="w-3 h-3" /> Stay: {item.duration}</span></div><div className="flex gap-8 text-right"><div><div className="text-xs text-slate-400 uppercase tracking-wider mb-1">Malaysia</div><div className="text-indigo-600 font-bold">{item.price_my}</div></div><div className="hidden md:block"><div className="text-xs text-slate-400 uppercase tracking-wider mb-1">Singapore</div><div className="text-slate-600 font-medium">{item.price_sg}</div></div></div></div>))}</div></div>))}</div>
            </div>
        );
        
        const FAQItem = ({ question, answer }) => {
            const [isOpen, setIsOpen] = useState(false);
            return (
                <div className="border-b border-slate-200 py-4 last:border-0">
                    <button onClick={() => setIsOpen(!isOpen)} className="w-full flex justify-between items-center text-left hover:text-indigo-600 transition"><span className="font-medium text-slate-800 text-lg">{question}</span>{isOpen ? <Minus className="w-5 h-5 text-indigo-600" /> : <Plus className="w-5 h-5 text-slate-400" />}</button>
                    <div className={`overflow-hidden transition-all duration-300 ${isOpen ? 'max-h-48 mt-3 opacity-100' : 'max-h-0 opacity-0'}`}><p className="text-slate-500 leading-relaxed pr-8">{answer}</p></div>
                </div>
            );
        };

        // --- MOCK & APP SHELL ---
        const MOCK_DB_INITIAL = {
            hospitals: [
                {id:1,name:"Island Hospital",city:"Penang",country:"Malaysia",rating:4.8,image:"https://images.unsplash.com/photo-1519494026892-80bbd2d6fd0d?w=500&q=80",badges:["JCI Accredited","Best for Cardiology"]},
                {id:2,name:"Gleneagles Singapore",city:"Singapore",country:"Singapore",rating:4.9,image:"https://images.unsplash.com/photo-1587351021759-3e566b9af953?w=500&q=80",badges:["JCI Accredited","Oncology Center"]},
                {id:3,name:"Sunway Medical Centre",city:"Kuala Lumpur",country:"Malaysia",rating:4.8,image:"https://images.unsplash.com/photo-1586773860418-d37222d8fce3?w=500&q=80",badges:["Multi-Specialty","Robotic Surgery"]}
            ],
            doctors: [], // Start empty, let useEffect fill it
            treatments: [
                {category:"Cardiology",items:[{name:"Coronary Angiogram",price_my:"RM 3,000",price_sg:"SGD 2,500",duration:"Day Case"},{name:"Heart Bypass (CABG)",price_my:"RM 60,000",price_sg:"SGD 50,000",duration:"7-10 Days"}]},
                {category:"Orthopedics",items:[{name:"Knee Replacement",price_my:"RM 35,000",price_sg:"SGD 25,000",duration:"4-5 Days"}]}
            ],
            testimonials: [
                { id: 1, name: "Sarah Jenkins", location: "Perth, Australia", text: "I was overwhelmed by the options in Penang. Ocha's AI narrowed it down to two specialists in seconds.", rating: 5 },
                { id: 2, name: "Budi Santoso", location: "Medan, Indonesia", text: "Sangat membantu. Saya bisa bandingkan harga paket jantung di Melaka dan KL langsung dari HP.", rating: 5 }
            ],
            faqs: [
                { q: "Is Ocha's service really free?", a: "Yes. We are funded by our partner hospitals to manage international patients. No markups." },
                { q: "How quickly can I get an appointment?", a: "Typically, we can secure appointments within 24-48 hours, even for specialists." }
            ]
        };

        const App = () => {
            const [view, setView] = useState('home');
            const [selectedDoctor, setSelectedDoctor] = useState(null);
            const [db, setDb] = useState(MOCK_DB_INITIAL);

            useEffect(() => { window.scrollTo(0, 0); }, [view]);

            // --- 1. FETCH & CLEAN DATA ---
            useEffect(() => {
                const fetchData = async () => {
                    try {
                        const res = await fetch(LIVE_DATA_URL);
                        const jsonData = await res.json();

                        // CLEANING LOGIC
                        const liveDoctors = jsonData
                            .filter(d => d.name && d.name !== "Unknown" && d.name.length > 2) // REMOVE GHOST ROWS
                            .map(d => ({
                                id: d.id || Math.floor(Math.random() * 10000),
                                name: d.name,
                                specialty: d.specialty || "General Practice",
                                hospital: d.hospital || "Partner Hospital",
                                location: d.city || d.location || "Malaysia",
                                experience: d.experience || "Available",
                                languages: d.languages ? d.languages.split(',').map(l => l.trim()) : ["English"],
                                image: d.image,
                                bio: d.bio
                            }));

                        setDb(prev => ({ ...prev, doctors: liveDoctors }));

                        // --- 2. CHECK FOR DIRECT LINK (SEO-LITE) ---
                        const params = new URLSearchParams(window.location.search);
                        const directId = params.get('id');
                        if (directId) {
                            const foundDoc = liveDoctors.find(d => d.id == directId);
                            if (foundDoc) {
                                setSelectedDoctor(foundDoc);
                                setView('doctor-profile');
                            }
                        }

                    } catch (error) { console.error("Error:", error); }
                };
                fetchData();
            }, []);

            const handleOpenProfile = (doctor) => {
                setSelectedDoctor(doctor);
                setView('doctor-profile');
            };

            return (
                <div className="min-h-screen relative bg-slate-50">
                    <div className="fixed inset-0 bg-tech-grid opacity-20 pointer-events-none z-0 mask-image-gradient"></div>
                    <nav className="fixed w-full z-50 glass-panel">
                        <div className="max-w-7xl mx-auto px-6 h-20 flex justify-between items-center">
                            <div onClick={() => setView('home')} className="cursor-pointer"><Logo className="h-10 w-auto" /></div>
                            <div className="hidden md:flex items-center space-x-8">
                                <button onClick={() => setView('hospitals')} className={`text-sm font-medium transition ${view === 'hospitals' ? 'text-indigo-600' : 'text-slate-600 hover:text-indigo-600'}`}>Hospitals</button>
                                <button onClick={() => setView('doctors')} className={`text-sm font-medium transition ${view === 'doctors' ? 'text-indigo-600' : 'text-slate-600 hover:text-indigo-600'}`}>Doctors</button>
                                <button onClick={() => setView('treatments')} className={`text-sm font-medium transition ${view === 'treatments' ? 'text-indigo-600' : 'text-slate-600 hover:text-indigo-600'}`}>Treatments</button>
                            </div>
                            <div className="hidden md:flex items-center gap-4"><button className="bg-indigo-600 text-white px-5 py-2.5 rounded-lg text-sm font-medium hover:bg-indigo-700 transition shadow-lg shadow-indigo-600/20 active:scale-95 transform duration-150">Book Consultation</button></div>
                        </div>
                    </nav>

                    {view === 'home' && (
                        <main className="relative z-10">
                            {/* Reuse Doctors Page for Home for now, or keep Hero */}
                             <div className="pt-40 pb-20 px-4 text-center animate-fade-up">
                                <h1 className="font-serif text-4xl md:text-6xl font-medium text-slate-900 tracking-tight mb-6 leading-tight">Medical concierge, <br/><span className="text-indigo-600 italic">reimagined with AI.</span></h1>
                                <p className="text-lg text-slate-500 max-w-2xl mx-auto mb-10 leading-relaxed font-sans">Experience seamless cross-border healthcare. We connect you with top specialists in Malaysia & Singapore.</p>
                                <div className="flex justify-center gap-4">
                                     <button onClick={() => setView('doctors')} className="bg-indigo-600 text-white px-8 py-4 rounded-xl font-bold text-lg hover:bg-indigo-700 transition shadow-lg flex items-center gap-2">Find a Specialist <ArrowRight className="w-5 h-5" /></button>
                                </div>
                            </div>
                            {/* FEATURED DOCTORS PREVIEW */}
                             <section className="py-20 bg-white">
                                <div className="max-w-7xl mx-auto px-6">
                                     <h2 className="font-serif text-3xl font-medium text-slate-900 mb-8 text-center">Top Specialists</h2>
                                     <div className="grid md:grid-cols-3 gap-6">
                                         {db.doctors.slice(0, 3).map((doc, i) => (
                                             <DoctorCard key={i} doc={doc} onClick={handleOpenProfile} />
                                         ))}
                                     </div>
                                </div>
                            </section>
                        </main>
                    )}

                    {view === 'doctors' && <DoctorsPage db={db} onDoctorClick={handleOpenProfile} />}
                    {view === 'hospitals' && <HospitalsPage db={db} />}
                    {view === 'treatments' && <TreatmentsPage db={db} />}
                    {view === 'doctor-profile' && <DoctorProfile doctor={selectedDoctor} onBack={() => setView('doctors')} />}

                    <footer className="bg-white border-t border-slate-200 py-12"><div className="max-w-7xl mx-auto px-6 flex flex-col md:flex-row justify-between items-center"><Logo className="h-8 opacity-80" /><div className="text-slate-400 text-sm mt-4 md:mt-0">© 2025 Ocha Healthcare. All rights reserved.</div></div></footer>
                </div>
            );
        };

        const root = createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
